name: Frontend
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install
      - name: Run Build Check
        working-directory: frontend
        run: npm run build
  cd:
    name: Continuous Deployment
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VercelToken }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VercelOrgId }}
          VERCEL_PROJECT_ID: ${{ secrets.VercelProjectId }}
      - name: Build Artifacts
        run: vercel build --prod --token=${{ secrets.VercelToken }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VercelOrgId }}
          VERCEL_PROJECT_ID: ${{ secrets.VercelProjectId }}
      - name: Deploy Artifacts To Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VercelToken }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VercelOrgId }}
          VERCEL_PROJECT_ID: ${{ secrets.VercelProjectId }}
